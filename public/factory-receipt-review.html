@media (hover: hover) {
  .preview-button:not(:disabled):not([aria-disabled="true"]):hover { border-color: var(--preview-accent); background: var(--preview-accent-bg); color: var(--preview-accent); }
  .preview-button[data-tone="primary"]:not(:disabled):hover { background: #a8e5ef; color: #082432; }
  .factory-preview[data-theme="baseline"] .preview-button[data-tone="primary"]:not(:disabled):hover { background: #07485a; color: #ffffff; }
  button.preview-step:hover, .preview-step[role="button"]:hover { border-color: var(--preview-accent); }
}
@media (min-width: 1500px) {
  .preview-main { padding-inline: 44px; }
  .preview-grid { grid-template-columns: 300px minmax(0, 1fr); }
}
@media (max-width: 1180px) {
  .preview-shell { grid-template-columns: 230px minmax(0, 1fr); }
  .preview-sidebar { padding-inline: 12px; }
  .preview-main { padding-inline: 20px; }
  .preview-grid { grid-template-columns: minmax(210px, 240px) minmax(0, 1fr); gap: 14px; }
  .preview-card { padding: 18px; }
  .preview-form { grid-template-columns: minmax(0, 1fr); }
  .preview-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .preview-shell { display: block; }
  .preview-sidebar { position: static; height: auto; overflow: visible; gap: 12px; padding: 15px 18px; border-inline-end: 0; border-block-end: 1px solid var(--preview-line); }
  .preview-sidebar .preview-brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 12px; padding: 0; }
  .preview-sidebar > .preview-nav { display: none; }
  .preview-sidebar > .preview-landmark, .preview-sidebar > .preview-side-caption { display: none; }
  .preview-mobile-nav { display: block; }
  .preview-mobile-nav > summary { min-height: 44px; padding: 9px 12px; color: var(--preview-text); border: 1px solid var(--preview-line); border-radius: 7px; background: var(--preview-raised); cursor: pointer; }
  .preview-mobile-nav[open] > summary { margin-block-end: 10px; }
  .preview-mobile-nav .preview-nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
  .preview-main { padding: 20px 18px 34px; }
  .preview-grid { grid-template-columns: minmax(220px, .65fr) minmax(0, 1fr); }
  .preview-topbar { align-items: start; }
  .preview-toolbar { width: 100%; }
}
@media (max-width: 680px) {
  .factory-preview { font-size: 14px; }
  .preview-grid { grid-template-columns: minmax(0, 1fr); }
  .preview-diff { grid-template-columns: minmax(0, 1fr); }
  .preview-steps-panel { padding: 16px; }
  .preview-steps-panel > details > summary { min-height: 44px; cursor: pointer; padding-block: 8px; }
  .preview-steps { gap: 5px; }
  .preview-step { min-height: 58px; }
  .preview-heading { margin-block: 20px 15px; }
  .preview-heading h1 { font-size: 25px; }
  .preview-heading p { font-size: 13px; }
  .preview-stats { gap: 9px; margin-block: 16px; }
  .preview-stat { padding: 14px; }
  .preview-stat strong { font-size: 25px; }
  .preview-card { padding: 17px; }
  .preview-notice { padding: 12px 14px; }
  .preview-work { gap: 14px; }
}
@media (max-width: 420px) {
  .preview-main { padding-inline: 12px; }
  .preview-sidebar { padding-inline: 12px; }
  .preview-topbar { gap: 11px; }
  .preview-topbar .preview-pill { font-size: 11px; }
  .preview-toolbar { gap: 8px; }
  .preview-toolbar > .preview-button { flex: 1 1 100%; }
  .preview-toolbar .preview-input { width: 100%; }
  .preview-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .preview-stat { padding: 12px; }
  .preview-stat > span { font-size: 11px; }
  .preview-stat strong { font-size: 23px; }
  .preview-card { padding: 15px; }
  .preview-readonly { grid-template-columns: minmax(0, 1fr); gap: 11px; padding: 13px; }
  .preview-actions { align-items: stretch; }
  .preview-actions > .preview-button { flex: 1 1 100%; }
  .preview-mobile-nav .preview-nav { grid-template-columns: minmax(0, 1fr); }
  .preview-heading { gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .factory-preview *, .factory-preview *::before, .factory-preview *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media (forced-colors: active) {
  .preview-button, .preview-step, .preview-card, .preview-stat, .preview-pill, .preview-chip, .preview-input { border: 1px solid CanvasText; }
  .preview-step[data-state="current"], .preview-nav-item[aria-current="page"] { border-width: 3px; }
}
@media print {
  .factory-preview { color-scheme: light; background: #ffffff; color: #111111; }
  .preview-shell, .preview-grid { display: block; }
  .preview-sidebar, .preview-toolbar, .preview-actions, .preview-mobile-nav { display: none; }
  .preview-main { padding: 0; }
  .preview-card, .preview-stat, .preview-steps-panel { background: #ffffff; box-shadow: none; border-color: #999999; break-inside: avoid; margin-block-end: 14px; }
  .preview-table-wrap { overflow: visible; }
  .preview-table { min-width: 0; }
}
